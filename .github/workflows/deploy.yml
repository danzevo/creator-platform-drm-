name: Deploy to InstaBox

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Run Deploy on InstaBox
      env:
        INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
      run: |
          npx --yes instabox@latest exec lumenbio --timeout 600 -- bash -c "
          set -e
          cd ~/creator-platform || git clone ${{ github.server_url }}/${{ github.repository }}.git ~/creator-platform
          cd ~/creator-platform
          git pull origin main
          docker compose down
          docker compose up -d --build
          docker system prune -f
          "