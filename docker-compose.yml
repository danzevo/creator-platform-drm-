services:
  # 1. PostgreSQL Database
  postgres: 
    image: postgres:15-alpine
    container_name: lumen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-creator_platform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
  # 2. Redis Task Queue
  redis:
    image: redis:7-alpine
    container_name: lumen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  # 3. Spring Boot Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumen_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-creator_platform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-supersecretkeyforjwttokengenerationshouldbelongenough12345}
    volumes:
      - shared_storage:/app/storage
  # 4. Python PyMuPDF DRM Worker
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: lumen_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secret}@postgres:5432/${DB_NAME:-creator_platform}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_DIR: /app/storage/watermarked
    volumes:
      # Mount shared storage so worker stamps the exact files backend serves
      - shared_storage:/app/storage
  # 5. Vue 3 Frontend + Nginx Gateway
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumen_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  shared_storage: